  <!-- Main content -->
  <main class="contact-page">

    <header class="contact-header">
      <span class="contact-eyebrow">Write to us</span>
      <h1 class="contact-title">Send a Letter</h1>
      <p class="contact-epigraph">Words are the leaves of the mind's tree.</p>
    </header>

    <div class="contact-card card">

      <form
        class="contact-form"
        name="contact"
        method="POST"
        netlify
        novalidate
        id="contactForm"
      >
        <input type="hidden" name="form-name" value="contact">

        <div class="form-group">
          <label class="form-label" for="name">Your name</label>
          <input
            class="form-input"
            type="text"
            id="name"
            name="name"
            placeholder="How shall we address you?"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Your email</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="Where may we reply?"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="message">Your message</label>
          <textarea
            class="form-textarea"
            id="message"
            name="message"
            placeholder="Tell us what moves you..."
            required
          ></textarea>
        </div>

        <div class="form-footer">
          <button class="btn-send" type="submit">Send Letter</button>
        </div>

      </form>

      <!-- Success message (shown after JS-intercepted submit) -->
      <div class="form-success" id="formSuccess" aria-live="polite" role="status">
        <span class="success-glyph" aria-hidden="true">&#10022;</span>
        <p class="success-text">
          Your letter has arrived.<br>
          <em>We will read it carefully.</em>
        </p>
      </div>

    </div>
  </main>

  <!-- Site footer -->
  <footer class="site-footer">
    <span class="footer-copy">&copy; 2026 QuillVerse Poetry</span>
    <a href="index.html" class="footer-cta">Read a poem</a>
  </footer>

  <script>
    // Graceful enhancement: show inline success if JS available,
    // otherwise the form submits naturally to Netlify.
    const form = document.getElementById('contactForm');
    const success = document.getElementById('formSuccess');

    if (form && success) {
      form.addEventListener('submit', function (e) {
        // Only intercept if all fields are filled
        const name = form.querySelector('#name').value.trim();
        const email = form.querySelector('#email').value.trim();
        const message = form.querySelector('#message').value.trim();

        if (!name || !email || !message) return; // let native validation handle

        e.preventDefault();

        const data = new FormData(form);

        fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(data).toString(),
        })
          .then(() => {
            form.style.display = 'none';
            success.classList.add('visible');
          })
          .catch(() => {
            // Fall back to native submission on fetch error
            form.submit();
          });
      });
    }
  </script>

</body>
